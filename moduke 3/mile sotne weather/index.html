<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Travel Advisor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .search-box input {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .search-box button {
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #4f63c7;
        }

        .message {
            text-align: center;
            color: white;
            font-size: 18px;
            margin: 15px 0;
        }

        .error {
            background: #ffdddd;
            color: #b00020;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
            margin-bottom: 20px;
        }

        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            display: none;
        }

        .city-name {
            text-align: center;
            margin-bottom: 20px;
        }

        .city-name h2 {
            font-size: 30px;
            color: #333;
        }

        .weather-main {
            text-align: center;
            margin-bottom: 30px;
        }

        .weather-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 55px;
            font-weight: bold;
            color: #333;
        }

        .condition {
            font-size: 22px;
            color: #666;
            margin-top: 5px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .detail-box {
            background: #f4f6ff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .detail-box h3 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .detail-box p {
            color: #555;
        }

        .travel-section {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
        }

        .travel-section h2 {
            margin-bottom: 15px;
        }

        .travel-section p {
            line-height: 1.7;
            font-size: 17px;
        }

        .suggestions {
            margin-top: 15px;
            display: grid;
            gap: 10px;
        }

        .suggestion {
            background: rgba(255,255,255,0.15);
            padding: 12px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 25px;
        }

        /* Responsive Design */

        @media (max-width: 700px) {

            body {
                padding: 20px 10px;
            }

            header h1 {
                font-size: 30px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }

            .weather-card {
                padding: 20px;
            }

            .temperature {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🌤️ Weather Travel Advisor</h1>
        <p>Check the weather and plan your travel smartly</p>
    </header>

    <!-- City Search -->
    <div class="search-box">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name..."
        >

        <button onclick="searchWeather()">
            Search
        </button>
    </div>

    <div id="errorMessage" class="error"></div>

    <div id="loading" class="message" style="display:none;">
        Loading weather information...
    </div>

    <!-- Weather Card -->
    <div id="weatherCard" class="weather-card">

        <div class="city-name">
            <h2 id="cityName">Chennai</h2>
        </div>

        <!-- Dynamic Weather Icon -->
        <div class="weather-main">

            <div id="weatherIcon" class="weather-icon">
                ☀️
            </div>

            <div id="temperature" class="temperature">
                --°C
            </div>

            <div id="condition" class="condition">
                --
            </div>

        </div>

        <!-- Weather Details -->
        <div class="weather-details">

            <div class="detail-box">
                <h3>💧</h3>
                <p>Humidity</p>
                <strong id="humidity">--%</strong>
            </div>

            <div class="detail-box">
                <h3>💨</h3>
                <p>Wind Speed</p>
                <strong id="wind">-- km/h</strong>
            </div>

            <div class="detail-box">
                <h3>🌡️</h3>
                <p>Temperature</p>
                <strong id="feels">--°C</strong>
            </div>

        </div>

        <!-- Travel Suggestions -->
        <div class="travel-section">

            <h2>✈️ Travel Suggestions</h2>

            <p id="travelMessage">
                Travel recommendations will appear here.
            </p>

            <div id="suggestions" class="suggestions">
            </div>

        </div>

    </div>

    <footer>
        <p>Weather Travel Advisor </p>
    </footer>

</div>


<script>

    // Search weather when Enter key is pressed
    document.getElementById("cityInput").addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
            searchWeather();
        }

    });


    // Main weather function
    async function searchWeather() {

        const city = document.getElementById("cityInput").value.trim();

        const errorMessage = document.getElementById("errorMessage");
        const weatherCard = document.getElementById("weatherCard");
        const loading = document.getElementById("loading");

        // Clear previous error
        errorMessage.style.display = "none";

        // Validate input
        if (city === "") {

            showError("Please enter a city name.");

            return;
        }

        try {

            loading.style.display = "block";
            weatherCard.style.display = "none";

            // STEP 1:
            // Find latitude and longitude of the city

            const geoResponse = await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
            );

            if (!geoResponse.ok) {
                throw new Error("Unable to connect to location service.");
            }

            const geoData = await geoResponse.json();

            // Check whether city exists
            if (!geoData.results || geoData.results.length === 0) {

                throw new Error("City not found. Please enter a valid city name.");

            }

            const location = geoData.results[0];

            // STEP 2:
            // Get weather using latitude and longitude

            const weatherResponse = await fetch(
                `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`
            );

            if (!weatherResponse.ok) {
                throw new Error("Unable to fetch weather information.");
            }

            const weatherData = await weatherResponse.json();

            const current = weatherData.current;

            // Display weather
            displayWeather(location, current);

        }

        catch (error) {

            showError(error.message);

        }

        finally {

            loading.style.display = "none";

        }

    }


    // Display weather data
    function displayWeather(location, weather) {

        const weatherCard = document.getElementById("weatherCard");

        document.getElementById("cityName").textContent =
            `${location.name}, ${location.country}`;

        document.getElementById("temperature").textContent =
            `${Math.round(weather.temperature_2m)}°C`;

        document.getElementById("humidity").textContent =
            `${weather.relative_humidity_2m}%`;

        document.getElementById("wind").textContent =
            `${weather.wind_speed_10m} km/h`;

        document.getElementById("feels").textContent =
            `${Math.round(weather.apparent_temperature)}°C`;


        // Get weather information
        const weatherInfo = getWeatherInfo(weather.weather_code);

        // Dynamic icon
        document.getElementById("weatherIcon").textContent =
            weatherInfo.icon;

        // Weather condition
        document.getElementById("condition").textContent =
            weatherInfo.condition;


        // Travel recommendations
        displayTravelSuggestions(weatherInfo.type);


        weatherCard.style.display = "block";
    }


    // Convert weather code into condition + icon
    function getWeatherInfo(code) {

        if (code === 0) {

            return {
                icon: "☀️",
                condition: "Clear Sky",
                type: "sunny"
            };

        }

        if (code === 1 || code === 2) {

            return {
                icon: "🌤️",
                condition: "Partly Cloudy",
                type: "cloudy"
            };

        }

        if (code === 3) {

            return {
                icon: "☁️",
                condition: "Cloudy",
                type: "cloudy"
            };

        }

        if (code >= 45 && code <= 48) {

            return {
                icon: "🌫️",
                condition: "Foggy",
                type: "foggy"
            };

        }

        if (code >= 51 && code <= 67) {

            return {
                icon: "🌧️",
                condition: "Rainy",
                type: "rainy"
            };

        }

        if (code >= 71 && code <= 77) {

            return {
                icon: "❄️",
                condition: "Snowy",
                type: "snow"
            };

        }

        if (code >= 80 && code <= 82) {

            return {
                icon: "🌦️",
                condition: "Rain Showers",
                type: "rainy"
            };

        }

        if (code >= 95) {

            return {
                icon: "⛈️",
                condition: "Thunderstorm",
                type: "storm"
            };

        }

        return {
            icon: "🌤️",
            condition: "Unknown",
            type: "cloudy"
        };
    }


    // Travel suggestions based on weather
    function displayTravelSuggestions(type) {

        const message = document.getElementById("travelMessage");
        const suggestions = document.getElementById("suggestions");

        let travelMessage = "";
        let suggestionList = [];


        if (type === "sunny") {

            travelMessage =
                "The weather is great for outdoor travel. You can explore the city and enjoy outdoor activities.";

            suggestionList = [
                "🏖️ Visit beaches and outdoor attractions",
                "📸 Go sightseeing and photography",
                "🚶 Take a walking tour",
                "🌳 Visit parks and gardens"
            ];

        }


        else if (type === "cloudy") {

            travelMessage =
                "The weather is comfortable for exploring. It is a good time for city tours.";

            suggestionList = [
                "🏛️ Visit historical places",
                "🚶 Explore the city",
                "📸 Take photographs",
                "☕ Visit cafés and local restaurants"
            ];

        }


        else if (type === "rainy") {

            travelMessage =
                "Rain is expected, so indoor activities are recommended.";

            suggestionList = [
                "🏛️ Visit museums",
                "🎬 Watch a movie",
                "☕ Explore cafés",
                "🛍️ Go shopping"
            ];

        }


        else if (type === "storm") {

            travelMessage =
                "Thunderstorms are expected. It is safer to avoid outdoor travel.";

            suggestionList = [
                "🏠 Stay indoors",
                "🏨 Relax at your hotel",
                "📚 Visit indoor attractions only",
                "⚠️ Avoid beaches and open areas"
            ];

        }


        else if (type === "snow") {

            travelMessage =
                "Snowy conditions are suitable for winter activities. Travel carefully.";

            suggestionList = [
                "⛷️ Try winter sports",
                "☕ Enjoy warm cafés",
                "📸 Take winter photographs",
                "🧥 Carry suitable winter clothing"
            ];

        }


        else if (type === "foggy") {

            travelMessage =
                "Visibility may be low. Be careful while travelling.";

            suggestionList = [
                "🚗 Drive carefully",
                "🏛️ Prefer indoor attractions",
                "☕ Visit cafés",
                "⚠️ Avoid long-distance outdoor travel"
            ];

        }


        message.textContent = travelMessage;

        suggestions.innerHTML = "";

        suggestionList.forEach(function(item) {

            const div = document.createElement("div");

            div.className = "suggestion";

            div.textContent = item;

            suggestions.appendChild(div);

        });

    }


    // Error handling
    function showError(message) {

        const errorMessage = document.getElementById("errorMessage");

        errorMessage.textContent = message;

        errorMessage.style.display = "block";

        document.getElementById("weatherCard").style.display = "none";

    }

</script>

</body>
</html>

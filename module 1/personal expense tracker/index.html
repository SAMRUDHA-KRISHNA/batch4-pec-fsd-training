
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #expenseList {
            margin-top: 15px;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        .summary {
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        .summary p {
            font-size: 17px;
            font-weight: bold;
        }

        .savings {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Personal Expense Calculator</h1>

        <label>Monthly Income</label>
        <input
            type="number"
            id="income"
            placeholder="Enter your income"
        >

        <h2>Add Expense</h2>

        <input
            type="text"
            id="category"
            placeholder="Enter expense category"
        >

        <input
            type="number"
            id="amount"
            placeholder="Enter expense amount"
        >

        <button onclick="addExpense()">Add Expense</button>

        <h2>Expense Summary</h2>

        <div id="expenseList"></div>

        <div class="summary">
            <p>Total Income: ₹<span id="totalIncome">0</span></p>

            <p>Total Expenses: ₹<span id="totalExpenses">0</span></p>

            <p class="savings">
                Savings: ₹<span id="savings">0</span>
            </p>
        </div>

    </div>


    <script>

        let expenses = [];

        function addExpense() {

            let category =
                document.getElementById("category").value;

            let amount =
                Number(document.getElementById("amount").value);

            let income =
                Number(document.getElementById("income").value);


            if (income <= 0) {
                alert("Please enter your income.");
                return;
            }

            if (category === "" || amount <= 0) {
                alert("Please enter a valid expense.");
                return;
            }


            expenses.push({
                category: category,
                amount: amount
            });


            displayExpenses();

            calculateSummary(income);


            document.getElementById("category").value = "";

            document.getElementById("amount").value = "";
        }


        function displayExpenses() {

            let expenseList =
                document.getElementById("expenseList");

            expenseList.innerHTML = "";


            expenses.forEach(function(expense) {

                let div =
                    document.createElement("div");

                div.className = "expense-item";


                div.innerHTML =
                    `<span>${expense.category}</span>
                     <span>₹${expense.amount}</span>`;


                expenseList.appendChild(div);

            });
        }


        function calculateSummary(income) {

            let totalExpenses = 0;


            expenses.forEach(function(expense) {

                totalExpenses += expense.amount;

            });


            let savings = income - totalExpenses;


            document.getElementById("totalIncome").innerText =
                income;

            document.getElementById("totalExpenses").innerText =
                totalExpenses;

            document.getElementById("savings").innerText =
                savings;
        }

    </script>

</body>
</html>
